[project]
name = "classifiles"
version = "0.1.0"
description = "Classify files from inbox folders (e.g. Downloads) into your folder taxonomy with a local decision model."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "pypdf>=5",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "pillow>=11",
]

[project.optional-dependencies]
laya = ["laya>=0.4.8"]
examples = ["sentence-transformers>=5.0", "numpy>=2"]
ocr = ["rapidocr-onnxruntime>=1.4"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
cli = ["typer>=0.15", "rich>=13"]
all = ["classifiles[laya,examples,ocr,api,cli]"]

[project.scripts]
classifiles = "classifiles_cli.main:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classifiles", "src/classifiles_api", "src/classifiles_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
